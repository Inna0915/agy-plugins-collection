<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目线程</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/theme.css">
</head>
<body>

  <!-- ==================== VIEW A: SWARM-MATCHED PROJECT THREADS OVERVIEW ==================== -->
  <section id="board-screen" class="screen">
    <header class="pt-header">
      <div class="header-row">
        <h1 id="panel-title" class="header-title">项目线程</h1>
        <div class="header-actions">
          <span id="toast" class="toast" role="status" aria-live="polite"></span>
          <span id="live-pill" class="live" role="status" title="自动实时同步">
            <span class="live-dot" aria-hidden="true"></span>
            <span id="live-label">实时</span>
          </span>
          <button type="button" id="btn-bind" class="ghost" hidden></button>
          <button type="button" id="btn-open-coord" class="coord-jump-btn" hidden></button>
          <button type="button" id="btn-new" class="pill-action-btn">
            <svg class="ico ico-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span id="lbl-new">新建</span>
          </button>
        </div>
      </div>

      <nav class="nav-tabs" role="tablist">
        <button type="button" role="tab" class="nav-tab active" data-tab="threads" id="tab-threads" aria-selected="true">
          <span id="lbl-tab-threads">线程</span>
          <span id="badge-waiting" class="tab-badge warn tabular"></span>
          <span id="cnt-threads" class="tab-count tabular"></span>
        </button>
        <button type="button" role="tab" class="nav-tab" data-tab="library" id="tab-library" aria-selected="false">
          <span id="lbl-tab-library">知识库</span>
          <span id="cnt-library" class="tab-count tabular"></span>
        </button>
        <button type="button" role="tab" class="nav-tab" data-tab="archived" id="tab-archived" aria-selected="false">
          <span id="lbl-tab-archived">已归档</span>
          <span id="cnt-archived" class="tab-count tabular"></span>
        </button>
      </nav>
    </header>

    <div id="board-body" class="board-body">
      <!-- Slide-Down Dispatch Drawer -->
      <div id="dispatch-drawer" class="drawer">
        <div class="drawer-hdr">
          <span id="lbl-drawer-title" class="drawer-title">新建后台工作线程</span>
          <button type="button" id="btn-close-drawer" class="icon-ghost-btn" title="关闭">
            <svg class="ico ico-sm" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="field">
          <label id="lbl-f-engine">执行引擎</label>
          <div id="f-engine-seg" class="engine-seg" role="radiogroup">
            <button type="button" class="engine-seg-btn active" data-engine="antigravity" id="btn-eng-agy" aria-checked="true">Antigravity</button>
            <button type="button" class="engine-seg-btn" data-engine="codex" id="btn-eng-codex" aria-checked="false">Codex</button>
          </div>
          <input id="f-engine" type="hidden" value="antigravity">
        </div>
        <div class="field">
          <label id="lbl-f-title" for="f-title">线程标题</label>
          <input id="f-title" type="text" autocomplete="off">
        </div>
        <div id="f-agy-opts" class="row2 field">
          <div>
            <label id="lbl-f-branch" for="f-branch">Git 分支名（可选）</label>
            <input id="f-branch" type="text" placeholder="thread/thr-xxx-..." autocomplete="off">
          </div>
          <div>
            <label id="lbl-f-model" for="f-model">模型</label>
            <select id="f-model">
              <option value="gemini-4-neon-xhigh" selected>Gemini 4 Neon (XHigh)</option>
              <option value="inherit">跟随当前总控</option>
              <option value="pro">Pro</option>
              <option value="flash">Flash</option>
              <option value="flash_lite">Flash Lite</option>
            </select>
          </div>
        </div>
        <div id="f-codex-opts" class="codex-opts" hidden>
          <div class="row2 field">
            <div>
              <label id="lbl-f-codex-kind" for="f-codex-kind">任务类型</label>
              <select id="f-codex-kind">
                <option value="implement" selected>实现（可写 · 自动隔离工作树）</option>
                <option value="review">审查（硬锁只读 · 原位）</option>
                <option value="plan">双盲方案（硬锁只读 · 原位）</option>
              </select>
            </div>
            <div>
              <label id="lbl-f-codex-effort" for="f-codex-effort">思考档位</label>
              <select id="f-codex-effort">
                <option value="" selected>默认（沿用全局配置）</option>
                <option value="high">高（high）</option>
                <option value="xhigh">超高（xhigh）</option>
                <option value="max">极高（max）</option>
                <option value="medium">中（medium）</option>
                <option value="low">低（low）</option>
                <option value="ultra">极限（ultra）</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label id="lbl-f-codex-model" for="f-codex-model">Codex 模型（可选）</label>
            <input id="f-codex-model" type="text" placeholder="留空默认沿用 Codex 全局配置" autocomplete="off">
          </div>
          <div class="codex-toggles">
            <label class="chk">
              <input id="f-codex-fast" type="checkbox">
              <span id="lbl-f-codex-fast">高速档位</span>
            </label>
            <label class="chk">
              <input id="f-codex-handoff" type="checkbox">
              <span id="lbl-f-codex-handoff">强结构化回执</span>
            </label>
          </div>
        </div>
        <label class="chk">
          <input id="f-wt" type="checkbox" checked>
          <span id="lbl-f-wt"></span>
        </label>
        <div class="field">
          <label id="lbl-f-prompt" for="f-prompt">任务说明</label>
          <textarea id="f-prompt" rows="3"></textarea>
        </div>
        <div class="drawer-actions">
          <button type="button" id="btn-submit-dispatch" class="btn-solid">启动线程</button>
          <button type="button" id="btn-cancel-dispatch" class="btn-secondary">取消</button>
          <span id="dispatch-msg" class="err"></span>
        </div>
      </div>

      <!-- Tab 1: Swarm-Style Overview Cards (Goal + Running + Progress/Tasks) -->
      <div id="threads-pane">
        <div id="goal-card" class="pt-card goal-card">
          <div class="goal-kicker">
            <span id="goal-kicker-text">当前项目</span>
            <div class="goal-actions">
              <button type="button" id="btn-card-coord" class="coord-card-btn" hidden></button>
              <button type="button" id="btn-sort" class="sort-chip" hidden>
                <span id="lbl-sort">按状态</span>
                <svg class="ico ico-xs" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
            </div>
          </div>
          <div id="goal-title" class="goal-title">当前项目</div>
          <div id="goal-sub" class="goal-sub"></div>
          <div id="goal-metrics" class="ctx-metrics-strip goal-metrics" hidden></div>
        </div>

        <div id="threads-cards"></div>
      </div>

      <!-- Tab 2: Library (Shared Project Memory & Active Git Worktrees) -->
      <div id="library-pane" hidden>
        <div class="lib-card">
          <div class="lib-card-hdr">
            <span class="lib-card-title">
              <svg class="ico" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              <span id="lbl-lib-mem">共享项目记忆</span>
            </span>
            <span id="mem-path" class="lib-path-pill"></span>
          </div>
          <textarea id="mem-editor" spellcheck="false"></textarea>
          <div class="lib-card-foot">
            <button type="button" id="btn-save-mem" class="btn-solid"></button>
            <button type="button" id="btn-reload-mem" class="btn-secondary"></button>
          </div>
        </div>

        <div>
          <div class="lib-sec-title">
            <span id="lbl-lib-wt">活跃工作树分支</span>
            <span id="wt-count" class="mono tabular"></span>
          </div>
          <div id="lib-wt-list"></div>
        </div>
      </div>

      <!-- Tab 3: Archived Threads -->
      <div id="archived-pane" hidden>
        <div id="archived-list"></div>
      </div>
    </div>
  </section>

  <!-- ==================== VIEW B: INLINE SLIDE-OVER THREAD CHAT ==================== -->
  <section id="thread-screen" class="screen screen-slide" hidden>
    <header class="chat-hdr">
      <div class="chat-hdr-left">
        <button type="button" id="btn-back" class="back-btn">
          <svg class="ico" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          <span id="lbl-back">线程</span>
          <span id="other-running-badge" class="other-running-pill tabular"></span>
        </button>
        <span id="chat-tid" class="hdr-tid"></span>
        <span id="chat-title-text" class="hdr-title"></span>
      </div>

      <div class="chat-hdr-right">
        <span id="chat-status-dot" class="sdot ok"></span>
        <button type="button" id="btn-chat-coord" class="row-act" hidden></button>
        <button type="button" id="btn-sync-coord" class="row-act"></button>
        <button type="button" id="btn-clean-wt-cur" class="row-act act-clean-wt" hidden></button>
        <button type="button" id="btn-archive-cur" class="row-act"></button>
        <button type="button" id="btn-popout-cur" class="icon-ghost-btn">
          <svg class="ico" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </button>
      </div>
    </header>

    <div id="chat-stream" class="chat-stream"></div>

    <div class="composer-wrap">
      <div id="live-bar" class="live-bar" hidden>
        <span class="sdot run"></span>
        <span id="live-bar-text"></span>
      </div>
      <div id="pt-model-menu" class="pt-model-menu" role="listbox" hidden></div>
      <div class="composer-pill">
        <textarea id="chat-input" rows="1"></textarea>
        <div class="composer-bar">
          <span id="composer-meta" class="composer-meta"></span>
          <button type="button" id="btn-send" class="send-circle">
            <svg class="ico" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- ==================== IN-DOM CONFIRMATION MODAL (ARCHIVE / WORKTREE CLEANUP) ==================== -->
  <div id="pt-modal-backdrop" class="pt-modal-backdrop" hidden>
    <div id="pt-modal" class="pt-modal" role="dialog" aria-modal="true" aria-labelledby="pt-modal-title">
      <div class="pt-modal-hdr">
        <span id="pt-modal-title" class="pt-modal-title"></span>
        <button type="button" id="pt-modal-close" class="icon-ghost-btn" aria-label="关闭">
          <svg class="ico ico-sm" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="pt-modal-body" class="pt-modal-body">
        <div id="pt-modal-thread" class="pt-modal-thread"></div>
        <div id="pt-modal-wt-info" class="pt-modal-wt-info"></div>
        <div id="pt-modal-warn" class="pt-modal-warn" hidden></div>
        <label id="pt-modal-remove-row" class="chk pt-modal-chk" hidden>
          <input id="pt-modal-remove-wt" type="checkbox">
          <span id="lbl-modal-remove-wt"></span>
        </label>
        <label id="pt-modal-branch-row" class="chk pt-modal-chk" hidden>
          <input id="pt-modal-del-branch" type="checkbox" checked>
          <span id="lbl-modal-del-branch"></span>
        </label>
        <label id="pt-modal-force-row" class="chk pt-modal-chk warn" hidden>
          <input id="pt-modal-force-wt" type="checkbox">
          <span id="lbl-modal-force-wt"></span>
        </label>
        <div id="pt-modal-err" class="err" hidden></div>
      </div>
      <div class="pt-modal-foot">
        <button type="button" id="pt-modal-cancel" class="btn-secondary"></button>
        <button type="button" id="pt-modal-confirm" class="btn-solid"></button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
